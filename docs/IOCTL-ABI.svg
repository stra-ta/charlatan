<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Charlatan ioctl ABI</title>
  <desc id="desc">The versioned ioctl surface exposes reset, statistics, producer control, overflow injection, and deterministic faults. Each command carries an ABI version so userspace and the module stay compatible.</desc>
  <defs>
    <marker id="c-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2f7d5b"/>
    </marker>
    <marker id="c-return" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7d4f6b"/>
    </marker>
    <style>
      .canvas { fill: #f7faf8; }
      .title { fill: #20262a; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subtitle { fill: #59616a; font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group { fill: #59616a; font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .node { fill: #ffffff; stroke: #20262a; stroke-width: 1.5; rx: 10; }
      .node-title { fill: #20262a; font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .node-copy { fill: #59616a; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .number { fill: #2f7d5b; font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .flow { fill: none; stroke: #2f7d5b; stroke-width: 2.5; marker-end: url(#c-arrow); }
      .fault { fill: none; stroke: #7d4f6b; stroke-width: 2; stroke-dasharray: 5 5; marker-end: url(#c-return); }
      .abi rect { fill: #eaf2ec; stroke: #2f7d5b; stroke-width: 1.5; rx: 12; }
      .abi .label { fill: #1f5a40; font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="960" height="540"/>
  <text class="title" x="50" y="52">Charlatan ioctl ABI</text>
  <text class="subtitle" x="50" y="79">One versioned command surface for control, inspection, and fault injection.</text>

  <g class="abi" transform="translate(320 110)">
    <rect width="320" height="64"/>
    <text class="label" x="160" y="30">ioctl(fd, CHARLATAN_CMD, arg)</text>
    <text class="label" x="160" y="50">ABI version: v1</text>
  </g>
  <path class="flow" d="M480 174 V220"/>
  <path d="M130 220 H830" fill="none" stroke="#2f7d5b" stroke-width="2.5"/>

  <path class="flow" d="M130 220 V280"/>
  <path class="flow" d="M305 220 V280"/>
  <path class="flow" d="M480 220 V280"/>
  <path class="flow" d="M655 220 V280"/>
  <path class="flow" d="M830 220 V280"/>

  <rect class="node" x="50" y="280" width="160" height="110"/>
  <text class="number" x="70" y="308">C1</text>
  <text class="node-title" x="130" y="330">RESET</text>
  <text class="node-copy" x="130" y="356">clear ring</text>
  <text class="node-copy" x="130" y="376">bump generation</text>

  <rect class="node" x="225" y="280" width="160" height="110"/>
  <text class="number" x="245" y="308">C2</text>
  <text class="node-title" x="305" y="330">STATISTICS</text>
  <text class="node-copy" x="305" y="356">usage · drops</text>
  <text class="node-copy" x="305" y="376">generations</text>

  <rect class="node" x="400" y="280" width="160" height="110"/>
  <text class="number" x="420" y="308">C3</text>
  <text class="node-title" x="480" y="322">PRODUCER</text>
  <text class="node-title" x="480" y="342">CONTROL</text>
  <text class="node-copy" x="480" y="370">start · pause · rate</text>

  <rect class="node" x="575" y="280" width="160" height="110"/>
  <text class="number" x="595" y="308">C4</text>
  <text class="node-title" x="655" y="322">OVERFLOW</text>
  <text class="node-title" x="655" y="342">INJECT</text>
  <text class="node-copy" x="655" y="370">force a full ring</text>

  <rect class="node" x="750" y="280" width="160" height="110"/>
  <text class="number" x="770" y="308">C5</text>
  <text class="node-title" x="830" y="330">FAULTS</text>
  <text class="node-copy" x="830" y="356">deterministic</text>
  <text class="node-copy" x="830" y="376">fault injection</text>

  <text class="subtitle" x="50" y="475">PRODUCER_CONTROL and FAULTS drive the concurrency and race-regression tests.</text>
</svg>
