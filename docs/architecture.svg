<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Charlatan kernel to userspace event path</title>
  <desc id="desc">C++ clients use system calls on charlatan0. The kernel module coordinates a mutex-protected ring, wait queue, statistics, and delayed simulated producer.</desc>
  <defs>
    <style>
      .canvas { fill: #fbfaf7; }
      .title { fill: #20262d; font: 700 28px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; }
      .subtitle { fill: #59616a; font: 14px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; }
      .group { fill: #59616a; font: 700 12px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; letter-spacing: 1.4px; }
      .node { fill: #ffffff; stroke: #20262d; stroke-width: 1.5; rx: 10; }
      .node-title { fill: #20262d; font: 700 15px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; }
      .node-copy { fill: #59616a; font: 13px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; }
      .number { fill: #93643a; font: 700 13px -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; }
      .flow { fill: none; stroke: #93643a; stroke-width: 2.5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #59616a; stroke-width: 1.5; stroke-dasharray: 5 5; marker-end: url(#return-arrow); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#93643a"/>
    </marker>
    <marker id="return-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#59616a"/>
    </marker>
  </defs>
  <rect class="canvas" width="900" height="470"/>
  <text class="title" x="50" y="55">Charlatan event path</text>
  <text class="subtitle" x="50" y="82">A virtual character device with explicit queue ownership and readiness.</text>
  <text class="group" x="50" y="128">USERSPACE</text>
  <text class="group" x="345" y="128">KERNEL MODULE</text>
  <rect class="node" x="50" y="150" width="220" height="128"/>
  <text class="number" x="72" y="181">01</text>
  <text class="node-title" x="72" y="209">C++20 clients</text>
  <text class="node-copy" x="72" y="235">integration, stress, benchmark</text>
  <text class="node-copy" x="72" y="256">read · write · ioctl · epoll</text>
  <rect class="node" x="345" y="150" width="195" height="128"/>
  <text class="number" x="367" y="181">02</text>
  <text class="node-title" x="367" y="209">/dev/charlatan0</text>
  <text class="node-copy" x="367" y="235">file operations</text>
  <text class="node-copy" x="367" y="256">poll and wait queue</text>
  <rect class="node" x="615" y="150" width="235" height="128"/>
  <text class="number" x="637" y="181">03</text>
  <text class="node-title" x="637" y="209">Bounded event ring</text>
  <text class="node-copy" x="637" y="235">128 slots under one mutex</text>
  <text class="node-copy" x="637" y="256">FIFO, drops, statistics</text>
  <rect class="node" x="615" y="330" width="235" height="88"/>
  <text class="number" x="637" y="360">04</text>
  <text class="node-title" x="637" y="387">Delayed producer</text>
  <text class="node-copy" x="637" y="408">rate, pause, reset, faults</text>
  <path class="flow" d="M270 214 H345"/>
  <path class="flow" d="M540 214 H615"/>
  <path class="flow" d="M732 330 V278"/>
  <path class="return" d="M675 278 V305 H445 V278"/>
  <text class="subtitle" x="372" y="335">readiness and statistics</text>
</svg>
