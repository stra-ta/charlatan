name: userspace

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate results manifest
        run: python3 ../.github/scripts/validate_manifest.py results/manifest.json || python3 /Users/nguyenhuyvu/projects/stra-ta/.github/scripts/validate_manifest.py results/manifest.json || echo "no manifest"
      - run: cmake -S userspace -B build/userspace -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/userspace --parallel
      - run: ctest --test-dir build/userspace --output-on-failure
